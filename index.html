<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勉強の成果物置き場</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* 上のバー：すりガラス */
    header {
      position: sticky;
      top: 0;
      background: rgba(251, 251, 253, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    header .site-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #1d1d1f;
    }
    #drawerBtn {
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 980px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.01em;
    }
    #drawerBtn:active { opacity: 0.8; }

    main { max-width: 720px; margin: 0 auto; padding: 72px 24px 64px; }
    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      color: #6e6e73;
      letter-spacing: 0.08em;
      margin: 0 0 14px;
    }
    h1 {
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.12;
      margin: 0 0 18px;
    }
    .lead {
      font-size: 17px;
      line-height: 1.65;
      color: #6e6e73;
      margin: 0 0 56px;
      max-width: 34em;
    }

    /* 最新の成果物カード */
    .card-label {
      font-size: 13px;
      font-weight: 600;
      color: #6e6e73;
      letter-spacing: 0.08em;
      margin: 0 0 12px;
    }
    .card {
      display: block;
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      text-decoration: none;
      color: #1d1d1f;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }
    .card:active { opacity: 0.85; }
    .card .card-title {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.45;
      margin: 0 0 6px;
    }
    .card .card-date { font-size: 13px; color: #6e6e73; margin: 0 0 14px; }
    .card .card-link { font-size: 15px; color: #0066cc; }
    .card .card-link::after { content: " ›"; }

    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-size: 12px;
      color: #86868b;
    }
    footer .operator-note { line-height: 1.8; margin: 0 0 10px; }
    footer .domain { margin: 0; }

    /* ドロワーの背景 */
    #drawerOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
      z-index: 40;
    }
    #drawerOverlay.open { opacity: 1; pointer-events: auto; }

    /* ドロワー本体（左から出る） */
    #drawerPanel {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 320px;
      max-width: 86vw;
      background: #fbfbfd;
      box-shadow: 12px 0 40px rgba(0, 0, 0, 0.18);
      transform: translateX(-105%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0.24, 1);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    #drawerPanel.open { transform: translateX(0); }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 14px;
    }
    .drawer-head .title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    #drawerClose {
      background: rgba(0, 0, 0, 0.06);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      color: #6e6e73;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-list { overflow-y: auto; padding: 4px 12px; }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      text-decoration: none;
      color: #1d1d1f;
    }
    .drawer-item:last-child { border-bottom: none; }
    .drawer-item .texts { flex: 1; min-width: 0; }
    .drawer-item .name { font-size: 15px; font-weight: 500; line-height: 1.5; }
    .drawer-item .date { font-size: 12px; color: #86868b; margin-top: 2px; }
    .drawer-item .chev { color: #c7c7cc; font-size: 18px; flex-shrink: 0; }
    .drawer-foot {
      padding: 14px 20px 20px;
      font-size: 12px;
      color: #86868b;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <span class="site-name">勉強の成果物置き場</span>
    <button id="drawerBtn" onclick="openDrawer()">☰ 成果物</button>
  </header>

  <main>
    <p class="eyebrow">STUDY ARCHIVE</p>
    <h1>勉強の成果物<br>置き場</h1>
    <p class="lead">勉強で作ったものを、置いておく場所です。<br>
    右上の「成果物」ボタンを押すと、横から一覧が開きます。</p>

    <p class="card-label">最新の成果物</p>
    <a class="card" href="motion-names-24.html">
      <p class="card-title">AIでアプリを作る時に使う、動きの名前24 — インタラクティブ図鑑</p>
      <p class="card-date">2026年11月23日</p>
      <span class="card-link">開く</span>
    </a>
  </main>

  <footer>
    <p class="domain">fuji.matcha-shizuoka.com</p>
  </footer>

  <!-- ドロワー -->
  <div id="drawerOverlay" onclick="closeDrawer()"></div>
  <aside id="drawerPanel">
    <div class="drawer-head">
      <span class="title">成果物の一覧</span>
      <button id="drawerClose" onclick="closeDrawer()">✕</button>
    </div>
    <nav class="drawer-list">
      <!-- 成果物はここに追加していく -->
      <a class="drawer-item" href="motion-names-24.html">
        <div class="texts">
          <div class="name">AIでアプリを作る時に使う、動きの名前24 — インタラクティブ図鑑</div>
          <div class="date">2026年11月23日</div>
        </div>
        <span class="chev">›</span>
      </a>
    </nav>
    <div class="drawer-foot">タップすると開きます</div>
  </aside>

  <script>
    function openDrawer() {
      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('drawerPanel').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
      document.getElementById('drawerPanel').classList.remove('open');
    }
    if (location.hash === '#drawer') openDrawer();
  </script>
<!-- 運営者について：生成AIの学習を開始して1年未満の初心者です。至らない点もあるかと思いますが、温かく見守っていただけますと幸いです。お手柔らかにお願いします。 -->
</body>
</html>
